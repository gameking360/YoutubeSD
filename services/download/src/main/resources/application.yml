spring:
  application:
    name: download
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/download_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
  flyway:
    sql-migration-prefix: ""
    sql-migration-separator: "_"

server:
  port: ${PORT:8080}

download:
  instance-id: ${INSTANCE_ID:local}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/alive"
