spring:
  application:
    name: download
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/download_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root123}
  flyway:
    sql-migration-prefix: ""
    sql-migration-separator: "_"
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:root123}
      timeout: 200ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000
    consumer:
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
      group-id: download
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8080/api/auth/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:youtubesd-security}
          audiences: ${JWT_AUDIENCE:youtubesd-api}

server:
  port: ${PORT:8080}

download:
  instance-id: ${INSTANCE_ID:local}
  progress-cache-ttl: ${PROGRESS_CACHE_TTL:1h}
  topics:
    video-published: ${KAFKA_TOPIC_VIDEO_PUBLISHED:video.published}
    video-removed: ${KAFKA_TOPIC_VIDEO_REMOVED:video.removed}
  storage:
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    hls-bucket: ${HLS_BUCKET:videos-hls}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  auth:
    mode: ${AUTH_MODE:header}

logging:
  level:
    org.apache.kafka: warn

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/alive"
